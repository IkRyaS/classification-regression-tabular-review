[project]
name = "classification-regression-tabular-review"
version = "0.1.0"
description = "Обзор и сравнение методов классификации и регрессии табличных данных"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "catboost>=1.2.10",
    "imbalanced-learn>=0.14.2",
    "jupyterlab>=4.6.4",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "rdata>=1.0",
    "scikit-learn>=1.9.1",
    "scikit-posthocs>=0.17.0",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "statsmodels>=0.15.0",
    "xgboost>=3.2.0",
]
